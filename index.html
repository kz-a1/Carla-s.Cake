:root {
  --cream: #fff8f1;
  --cocoa: #35231f;
  --cherry: #812f45;
  --cherry-hover: #642035;
  --pink: #ebc6c7;
  --rose-surface: #f5e6e2;
  --muted: #725e56;
  --line: #ddcfc4;
  --serif: "Carla Serif", Georgia, "Times New Roman", serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 110px; }
body { margin: 0; background: var(--cream); color: var(--cocoa); font: 16px/1.6 var(--sans); -webkit-font-smoothing: antialiased; }
body.dialog-open { overflow: hidden; }
button, input { font: inherit; }
button, a { -webkit-tap-highlight-color: transparent; }
button { color: inherit; cursor: pointer; }
a { color: inherit; text-decoration: none; }
img { display: block; width: 100%; max-width: 100%; height: auto; }
button { border: 0; }
figure, h1, h2, h3, p { margin: 0; }
h1, h2 { font-family: var(--serif); font-weight: 400; }
h2 { font-size: clamp(30px, 3.3vw, 43px); line-height: 1.25; letter-spacing: -.045em; }
h3 { line-height: 1.4; }
em { font-weight: 400; }
::selection { color: var(--cocoa); background: var(--pink); }
:focus-visible { outline: 3px solid var(--cherry); outline-offset: 5px; border-radius: 3px; }
.footer :focus-visible { outline-color: var(--pink); }
[hidden] { display: none !important; }
.container { width: min(1240px, calc(100% - 40px)); margin-inline: auto; }
.section { padding-block: 64px; }
.icon { width: 22px; height: 22px; flex: 0 0 22px; vertical-align: middle; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
.skip-link { position: fixed; top: 12px; left: 12px; z-index: 200; padding: 12px 18px; color: var(--cream); background: var(--cherry); transform: translateY(-160%); }
.skip-link:focus { transform: translateY(0); }
.eyebrow { color: var(--cherry); font-size: 11px; font-weight: 600; line-height: 1.6; letter-spacing: .12em; }
.button { display: inline-flex; align-items: center; justify-content: center; gap: 16px; min-height: 52px; padding: 13px 23px; border: 1px solid transparent; border-radius: 8px; font-size: 14px; font-weight: 600; line-height: 1.45; text-align: center; transition: background .2s ease, transform .2s ease, border-color .2s ease; }
.primary { background: var(--cherry); color: var(--cream); }
.outline { border-color: var(--cherry); color: var(--cherry); background: transparent; }
.text-link { display: inline-flex; min-height: 44px; align-items: center; justify-content: flex-start; gap: 12px; padding: 8px 0; background: none; color: var(--cherry); font-size: 14px; font-weight: 600; line-height: 1.45; text-align: left; text-underline-offset: 5px; }
.text-link .icon { width: 19px; height: 19px; flex-basis: 19px; }
.site-header { position: sticky; top: 0; z-index: 30; background: var(--cream); border-bottom: 1px solid var(--line); }
.header-inner { position: relative; display: flex; align-items: center; gap: 12px; min-height: 82px; }
.wordmark { display: flex; flex-direction: column; margin-right: auto; flex-shrink: 0; line-height: 1.15; }
.wordmark > span { font: 26px/1.2 var(--serif); letter-spacing: -.055em; }

        <div class="branch-actions">${ext(branch.linkKey, T.mapButton, 'button primary')}<button type="button" class="copy-button" data-copy="${index}" aria-label="${e(T.copyAddress)}">${icon('copy')}</button></div>
      </div>
    </article>` : `
    <article class="branch-card branch-pending">
      <span class="pending-number" aria-hidden="true">02</span>
      <h3>${e(branch.title)}</h3>
      <p>${e(T.secondBranchPending)}</p>
      <p class="muted">${e(T.secondBranchNote)}</p>
    </article>`).join('');

  document.documentElement.lang = C.locale;
  document.title = C.seo.title;
  const setMeta = (selector, value) => { const el = document.querySelector(selector); if (el) el.content = value; };
  setMeta('meta[name="description"]', C.seo.description);
  setMeta('meta[name="robots"]', C.seo.robots);
  setMeta('meta[property="og:title"]', C.seo.title);
  setMeta('meta[property="og:description"]', C.seo.description);
  setMeta('meta[property="og:locale"]', C.seo.locale);
  setMeta('meta[name="twitter:title"]', C.seo.title);
  setMeta('meta[name="twitter:description"]', C.seo.description);

  document.getElementById('site').innerHTML = `
    <a class="skip-link" href="#main">${e(T.skip)}</a>
    <header class="site-header" id="top">
      <div class="header-inner container">
        <a href="#top" class="wordmark" aria-label="${e(C.brand.name)} — ${e(T.backTop)}"><span>${e(C.brand.name)}</span><small>${e(C.brand.category)}</small></a>
        <nav class="navigation" id="navigation" aria-label="${e(T.navLabel)}">
          <a href="#cakes">${e(T.navProducts)}</a>
          <a href="#how">${e(T.navHow)}</a>
          <a href="#branches">${e(T.navBranches)}</a>
          ${ask('button primary nav-contact', T.contactButton)}
        </nav>
        <span class="demo-pill">${e(T.demo)}</span>
        <button class="menu-toggle" type="button" aria-controls="navigation" aria-expanded="false" aria-label="${e(T.menuOpen)}">${icon('menu')}</button>
      </div>
    </header>
    <main id="main" tabindex="-1">
      <section class="hero container" aria-labelledby="hero-title">
        <div class="hero-copy">
          <p class="eyebrow"><span class="tiny-dot"></span>${e(C.hero.eyebrow)}</p>
          <h1 id="hero-title">${e(C.hero.title)}<em>${e(C.hero.accent)}</em></h1>
          <p class="hero-description">${e(C.hero.description)}</p>
          <div class="hero-actions"><a class="button primary" href="#cakes">${e(T.browseButton)}${icon('arrow')}</a>${ask('text-link inquiry-link')}</div>
          <p class="hero-note">${icon('spark')}${e(T.heroFootnote)}</p>
        </div>
        <figure class="hero-figure">
          <div class="hero-photo">${image(C.hero, true)}${demoTag(C.hero.isDemo)}</div>
          <figcaption><span>${e(C.hero.caption)}</span><span aria-hidden="true">${e(C.brand.name)}</span></figcaption>
        </figure>
      </section>

      <section class="catalog section container" id="cakes" aria-labelledby="catalog-title">
        <div class="section-heading">
          <div><p class="eyebrow">${e(T.catalogEyebrow)}</p><h2 id="catalog-title">${e(T.catalogTitle)}</h2></div>
          <p class="section-description">${e(T.catalogDescription)}</p>
        </div>
        <div class="product-grid">${cards}</div>
        <p class="catalog-note">${icon('spark')}${e(T.catalogNote)}</p>
      </section>

      <section class="steps-wrap" id="how" aria-labelledby="how-title">
        <div class="container steps-inner">
          <div class="steps-heading"><div><p class="eyebrow">${e(T.stepsEyebrow)}</p><h2 id="how-title">${e(T.stepsTitle)}<em>${e(T.stepsAccent)}</em></h2></div><span class="large-spark" aria-hidden="true">${icon('spark')}</span></div>
          <ol class="steps-grid">${C.steps.map((step, i) => `<li><div class="step-top"><span class="step-number">0${i + 1}</span>${icon(step.icon)}</div><h3>${e(step.title)}</h3><p>${e(step.description)}</p></li>`).join('')}</ol>
          <div class="steps-bottom"><p>${e(T.stepsNote)}</p>${ask('button primary')}</div>
        </div>
      </section>

      <section class="branches section container" id="branches" aria-labelledby="branches-title">
        <div class="section-heading"><div><p class="eyebrow">${e(T.branchesEyebrow)}</p><h2 id="branches-title">${e(T.branchesTitle)}</h2></div><p class="section-description">${e(T.branchesDescription)}</p></div>
        <div class="branch-grid">${branchCards}</div>
        <p class="source-note">${e(C.source.note)} <a href="${e(C.source.url)}" target="_blank" rel="noopener noreferrer">${e(C.source.name)} · ${e(C.source.checkedAtLabel)}<span class="sr-only"> — ${e(T.external)}</span></a></p>
      </section>

      <section class="reviews container" aria-labelledby="reviews-title">
        <div class="review-mark" aria-hidden="true">${icon('message')}</div>
        <div class="review-copy"><p class="eyebrow">${e(T.reviewsEyebrow)}</p><h2 id="reviews-title">${e(T.reviewsTitle)}</h2><p>${e(T.reviewsDescription)}</p></div>
        ${ext('reviews', T.reviewsButton, 'button outline')}
      </section>
    </main>
    <footer class="footer">
      <div class="container">
        <div class="footer-top"><p class="footer-tagline">${e(T.footerTitle)}</p><a class="back-top" href="#top" aria-label="${e(T.backTop)}">${icon('arrow')}</a></div>
        <div class="footer-grid">
          <div><a href="#top" class="footer-wordmark">${e(C.brand.name)}</a><p>${e(C.brand.category)} · ${e(C.brand.city)}</p></div>
          <div><h2>${e(T.footerContact)}</h2>${ext('whatsapp', 'WhatsApp', 'footer-link')}${ext('instagram', 'Instagram', 'footer-link')}<p class="footer-provenance">${e(C.contact.channelStatus)}</p></div>
          <div><h2>${e(T.footerLocation)}</h2>${ext('map', C.branches[0].title, 'footer-link')}<a href="#branches" class="footer-link">${e(T.navBranches)}${icon('arrow')}</a></div>
        </div>
        <div class="footer-bottom"><p><span class="footer-demo">${e(T.demo)}</span>${e(T.footerNote)}</p><p>${e(T.footerSource)} ${e(C.source.checkedAtLabel)}</p></div>
      </div>
    </footer>
    <div class="mobile-action">${ask('button primary')}</div>
    <dialog class="contact-dialog" id="contact-dialog" aria-labelledby="contact-title" aria-describedby="contact-description">
      <button type="button" class="dialog-close" data-close aria-label="${e(T.close)}">${icon('close')}</button>
      <span class="dialog-icon">${icon('message')}</span>
      <p class="eyebrow">Carla’s Cake</p>
      <h2 id="contact-title">${e(T.contactTitle)}</h2>
      <p id="contact-description">${e(T.contactDescription)}</p>
      <div class="contact-links">${ext('whatsapp', T.whatsappButton, 'button primary', 'message')}${ext('instagram', T.instagramButton, 'button outline', 'instagram')}${ext('map', T.contactFallback, 'text-link')}</div>
      <p class="contact-provenance">${e(C.contact.provenance)}</p>
      <p class="contact-disclaimer">${e(T.contactNote)}</p>
    </dialog>

      <button type="button" class="dialog-close" data-close aria-label="${e(T.close)}">${icon('close')}</button>

    </dialog>

      <button type="button" class="dialog-close" data-close aria-label="${e(T.close)}">${icon('close')}</button>
      <h2 id="copy-title">${e(T.copyFallback)}</h2><p id="copy-text" class="selectable"></p>
    </dialog>
    <p class="toast" id="toast" role="status" aria-live="polite"></p>

  const nav = document.getElementById('navigation');
  const menu = document.querySelector('.menu-toggle');
  const mobile = window.matchMedia('(max-width: 959px)');
  const setMenu = open => {
    menu.setAttribute('aria-expanded', String(open));
    menu.setAttribute('aria-label', open ? T.menuClose : T.menuOpen);
    menu.innerHTML = icon(open ? 'close' : 'menu');
    nav.hidden = mobile.matches && !open;
  };
  setMenu(false);
  menu.addEventListener('click', () => setMenu(menu.getAttribute('aria-expanded') !== 'true'));
  mobile.addEventListener('change', () => setMenu(false));
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && menu.getAttribute('aria-expanded') === 'true') { setMenu(false); menu.focus(); }
  });
  document.addEventListener('click', event => {
    if (mobile.matches && !event.target.closest('.site-header')) setMenu(false);
    if (event.target.closest('.navigation a')) setMenu(false);
  });

  const contactDialog = document.getElementById('contact-dialog');
  const productDialog = document.getElementById('product-dialog');
  const copyDialog = document.getElementById('copy-dialog');
  let productTrigger = null;
  let dialogTrigger = null;
  const showDialog = (dialog, trigger) => {
    dialogTrigger = trigger;
    dialog.showModal();
    document.body.classList.add('dialog-open');
  };
  const showContact = trigger => {
    const returnTo = productDialog.open ? productTrigger : trigger;
    if (productDialog.open) productDialog.close();
    const fromMenu = nav.contains(trigger) && mobile.matches;
    setMenu(false);
    showDialog(contactDialog, fromMenu ? menu : returnTo);
  };
  const attachImageFallbacks = scope => {
    scope.querySelectorAll('img').forEach(img => {
      img.addEventListener('error', () => {
        img.style.visibility = 'hidden';
        const parent = img.parentElement;
        parent.classList.add('image-failed');
        if (!parent.querySelector('.image-fallback')) {
          const note = document.createElement('span');
          note.className = 'image-fallback';
          note.textContent = T.unavailableImage;
          parent.append(note);
        }
      }, { once: true });
    });
  };
  attachImageFallbacks(document);
  document.querySelectorAll('dialog').forEach(dialog => {
    dialog.querySelector('[data-close]').addEventListener('click', () => dialog.close());
    dialog.addEventListener('click', event => {
      if (event.target !== dialog) return;
      const rect = dialog.getBoundingClientRect();
      if (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom) dialog.close();
    });
    dialog.addEventListener('close', () => {
      if (!document.querySelector('dialog[open]')) {
        document.body.classList.remove('dialog-open');
        if (dialogTrigger?.isConnected) dialogTrigger.focus({ preventScroll: true });
      }
    });
  });

  document.addEventListener('click', async event => {
    const contactButton = event.target.closest('[data-contact]');
    if (contactButton) showContact(contactButton);
    const productButton = event.target.closest('[data-product]');
    if (productButton) {
      const product = C.products.find(item => item.id === productButton.dataset.product);
      if (!product) return;
      productTrigger = productButton;
      const panel = document.getElementById('product-dialog-content');
      panel.innerHTML = `<div class="product-dialog-image">${image(product)}${demoTag(product.isDemo)}</div><div class="product-dialog-copy"><p class="eyebrow">${e(product.isDemo ? T.productDemoTitle : C.brand.name)}</p><h2 id="product-title">${e(product.name)}</h2><p>${e(product.isDemo ? T.productDemoDescription : product.description)}</p><p class="dialog-price">${e(product.price ?? T.pricePending)}</p>${ask('button primary')}</div>`;
      attachImageFallbacks(panel);
      showDialog(productDialog, productButton);
    }
    const copy = event.target.closest('[data-copy]');
    if (copy) {
      const branch = C.branches[Number(copy.dataset.copy)];
      const address = [branch.address, branch.building].filter(Boolean).join(', ');
      try {
        if (!navigator.clipboard?.writeText) throw new Error('Clipboard unavailable');
        await navigator.clipboard.writeText(address);
        const toast = document.getElementById('toast');
        toast.textContent = T.copySuccess;
        toast.classList.add('visible');
        window.clearTimeout(window.carlaToastTimer);
        window.carlaToastTimer = window.setTimeout(() => toast.classList.remove('visible'), 3500);
      } catch {
        document.getElementById('copy-text').textContent = address;
        showDialog(copyDialog, copy);
      }
    }
  });
})();

</script>

 Сайттың мәзірі мен батырмаларын осы жерден тексеруге болады.\u003c/p\u003e\u003c/div\u003e\n  \u003cdiv class=\"controls\" role=\"group\" aria-label=\"Демо экранының ені\"\u003e\n    \u003cbutton type=\"button\" data-width=\"auto\" aria-pressed=\"true\"\u003eӨз экраным\u003c/button\u003e\n    \u003cbutton type=\"button\" data-width=\"360\" aria-pressed=\"false\"\u003eТелефон · 360\u003c/button\u003e\n    \u003cbutton type=\"button\" data-width=\"390\" aria-pressed=\"false\"\u003eТелефон · 390\u003c/button\u003e\n    \u003cbutton type=\"button\" data-width=\"768\" aria-pressed=\"false\"\u003eПланшет · 768\u003c/button\u003e\n    \u003cbutton type=\"button\" data-width=\"1440\" aria-pressed=\"false\"\u003eКомпьютер · 1440\u003c/button\u003e\n    \u003cbutton type=\"button\" class=\"open\" id=\"open-demo\"\u003eСайтты бөлек ашу ↗\u003c/button\u003e\n  \u003c/div\u003e\n\u003c/header\u003e\n\u003cmain\u003e\n  \u003cp id=\"status\" aria-live=\"polite\"\u003e\u003c/p\u003e\n  \u003cdiv id=\"viewport\"\u003e\u003ciframe id=\"demo\" title=\"Carla’s Cake сайтының жұмыс істейтін демосы\" allow=\"clipboard-write\"\u003e\u003c/iframe\u003e\u003c/div\u003e\n\u003c/main\u003e\n\u003cnoscript\u003eДемоны көру үшін JavaScript қосыңыз немесе жоба ішіндегі index.html файлын ашыңыз.\u003c/noscript\u003e\n\u003cscript type=\"application/json\" id=\"demo-source\"\u003e__DEMO_JSON__\u003c/script\u003e\n\u003cscript\u003e\n(() =\u003e {\n  const source = JSON.parse(document.getElementById('demo-source').textContent);\n  const frame = document.getElementById('demo');\n  const stage = document.getElementById('viewport');\n  const status = document.getElementById('status');\n  let widthChoice = 'auto';\n  let externalURL = null;\n  frame.srcdoc = source;\n  function resize() {\n    const available = Math.max(240, document.documentElement.clientWidth - 24);\n    const width = widthChoice === 'auto' ? available : Number(widthChoice);\n    const scale = Math.min(1, available / width);\n    co <script data-merge-ui id="merged-preview-controller">
(() => {
  'use strict';
  const template = JSON.parse(document.getElementById('merged-preview-template').textContent);
  const footer = document.querySelector('.footer .container');
  if (!footer) return;
  const row = document.createElement('div');
  row.className = 'merged-preview-row';
  row.setAttribute('data-merge-ui', '');
  const launch = document.createElement('button');
  launch.className = 'merged-preview-launch';
  launch.type = 'button';
  launch.textContent = 'Телефон / компьютер көрінісі ↗';
  launch.setAttribute('aria-haspopup', 'dialog');
  launch.setAttribute('aria-controls', 'merged-preview-dialog');
  row.append(launch);
  footer.append(row);

  const modal = document.createElement('dialog');
  modal.id = 'merged-preview-dialog';
  modal.setAttribute('data-merge-ui', '');
  modal.setAttribute('aria-labelledby', 'merged-preview-title');
  modal.innerHTML = '<div class="merged-preview-heading"><h2 id="merged-preview-title">Телефон және компьютер көрінісі</h2><button type="button" class="merged-preview-close" autofocus>Жабу ×</button></div><iframe id="merged-preview-frame" title="Экран өлшемдерін ауыстырып қарайтын демо" allow="clipboard-write"></iframe>';
  document.body.append(modal);
  const frame = modal.querySelector('iframe');
  const close = modal.querySelector('button');
  let ready = false;

  function makePreview() {
    const clean = document.documentElement.cloneNode(true);
    clean.querySelectorAll('[data-merge-ui]').forEach(node => node.remove());
    // app.js regenerates this region inside the preview, keeping embedded photos single.
    clean.querySelector('#site').replaceChildren();
    clean.querySelector('body').classList.remove('merged-preview-open', 'dialog-open');
    const source = '<!doctype html>\n' + clean.outerHTML;
    const payload = JSON.stringify(source).replace(/</g, '\\u003c').replace(/>/g, '\\u003e');
    return template.replace('__DEMO_JSON__', payload);
  }

  launch.addEventListener('click', () => {
    if (!ready) {
      frame.srcdoc = makePreview();
      ready = true;
    }
    modal.showModal();
    document.body.classList.add('merged-preview-open');
    close.focus();
  });
  close.addEventListener('click', () => modal.close());
  modal.addEventListener('close', () => {
    document.body.classList.remove('merged-preview-open');
    launch.focus({preventScroll: true});
  });
  // Escape closes the preview when focus is in either frame; preserve inner dialogs.
  frame.addEventListener('load', () => {
    const wireEscape = target => {
      try {
        target.contentWindow.addEventListener('keydown', event => {
          if (event.key !== 'Escape') return;
          if (target.contentDocument.querySelector('dialog[open]')) return;
          event.preventDefault();
          modal.close();
        });
      } catch {}
    };
    wireEscape(frame);
    try {
      const inner = frame.contentDocument.getElementById('demo');
      if (inner) {
        wireEscape(inner);
        inner.addEventListener('load', () => wireEscape(inner));
      }
    } catch {}
  });
})();
